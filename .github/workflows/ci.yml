name: ci
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
jobs:
  quality:
    # Self-hosted fleet runner (Test node) — zero GitHub-hosted minutes for this private drill repo.
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python (local toolchain)
        run: |
          python3 --version
          python3 -m pip install --quiet --user --break-system-packages pytest
      - name: Run tests
        run: python3 -m pytest -q
